[package]
name = "android-repo-setup"
version = "0.1.4"
edition = "2021"
license = "Apache-2.0"

[features]
cursive-preview = ["dep:arboard", "dep:cursive"]

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false, optional = true }
argon2 = "0.5"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
cursive = { version = "0.21.1", optional = true }
crypto_box = { version = "0.9.1", features = ["seal"] }
crypto_secretbox = "0.1"
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
fs2 = "0.4"
getrandom = "0.4"
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
roxmltree = "0.20"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
similar = "2"
tempfile = "3"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
ureq = { version = "3", default-features = false, features = ["platform-verifier", "rustls"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
