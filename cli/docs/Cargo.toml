[package]
name = "android-repo-docs"
version = "0.1.15"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
percent-encoding = "2"
png = "0.17"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
tree-sitter = "0.24"
tree-sitter-kotlin-ng = "1.1.0"
unicode-normalization = "0.1"
