name: Check Gradle plugins
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew check --no-daemon
  docs-navigation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test cli/site-theme/tests/*.test.mjs
  cli:
    name: Rust CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Select native GnuPG on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\GnuPG\bin",
            "${env:ProgramFiles(x86)}\GnuPG\bin"
          )
          $gpgBin = $candidates | Where-Object { Test-Path (Join-Path $_ 'gpg.exe') } | Select-Object -First 1
          if (-not $gpgBin) {
            $installer = Join-Path $env:RUNNER_TEMP 'gnupg-2.5.24.exe'
            $url = 'https://gnupg.org/ftp/gcrypt/binary/gnupg-w32-2.5.24_20260923.exe'
            Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 45
            $sha256 = 'ea6f9dee2cccd83287432625b8b399173805add81d27067fcaf019c0c4da1ad8'
            if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $sha256) {
              throw "GnuPG installer checksum mismatch"
            }
            $installDir = Join-Path $env:RUNNER_TEMP 'gnupg-native'
            $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
            & $sevenZip x -y $installer "-o$installDir"
            if ($LASTEXITCODE -ne 0) { throw "GnuPG payload extraction failed" }
            $gpgBin = Join-Path $installDir 'bin'
          }
          if (-not $gpgBin -or -not (Test-Path (Join-Path $gpgBin 'gpg.exe'))) {
            throw "Native GnuPG was not found"
          }
          $gpgBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $gpgBin 'gpg.exe') --version
      - name: Install Zola for integration tests
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/zola-tests"
          mkdir -p "$directory"
          if [[ "$RUNNER_OS" == Windows ]]; then
            archive="$RUNNER_TEMP/zola.zip"
            curl --fail --show-error --silent --location --retry 3 https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-pc-windows-msvc.zip --output "$archive"
            echo "79179284f816febc281adbedb27189806cf22f83e8be4d0fca6835fbeeb09587  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$directory"
          else
            archive="$RUNNER_TEMP/zola.tar.gz"
            curl --fail --show-error --silent --location --retry 3 https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz --output "$archive"
            echo "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4  $archive" | sha256sum -c -
            tar -xzf "$archive" -C "$directory"
          fi
          echo "$directory" >> "$GITHUB_PATH"
      - run: cargo test --locked --manifest-path cli/Cargo.toml
      - name: Verify evaluated Gradle module discovery
        if: runner.os == 'Linux'
        shell: bash
        env:
          GRADLE_BIN: ${{ github.workspace }}/gradlew
        run: cargo test --locked --manifest-path cli/Cargo.toml --test gradle_discovery -- --ignored
