name: Publish Gradle plugins to JitPack

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing project tag (vX.Y.Z)
        type: string
        default: ''
  workflow_call:
    inputs:
      source_tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-jitpack.yml
    with:
      source_tag: ${{ inputs.source_tag }}
      require_tag: true

  publish:
    needs: build
    concurrency:
      group: jitpack-plugin-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Trigger JitPack and verify the tagged plugin
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          repo=gradle.android-repo-setup
          url="https://jitpack.io/com/github/lambdawalker/$repo/$RELEASE_TAG"
          artifact="$repo-$RELEASE_TAG"
          curl -fsSL --retry 4 --retry-all-errors --retry-max-time 480 --max-time 90 \
            "$url/$artifact.pom" -o "$RUNNER_TEMP/plugin.pom"
          curl -fsSL --retry 4 --retry-all-errors --retry-max-time 120 --max-time 30 \
            "$url/$artifact.jar" -o "$RUNNER_TEMP/plugin.jar"
          curl -fsSL --max-time 30 "https://jitpack.io/api/builds/com.github.lambdawalker/$repo/$RELEASE_TAG" |
            jq -e --arg commit "$SOURCE_SHA" '.status == "ok" and .commit == $commit'
          unzip -Z1 "$RUNNER_TEMP/plugin.jar" > "$RUNNER_TEMP/plugin-entries"
          for id in com.apexfission.android-repo-setup com.apexfission.android-repo-setup.root; do
            grep -Fx "META-INF/gradle-plugins/$id.properties" "$RUNNER_TEMP/plugin-entries"
          done
          printf 'Verified `com.github.lambdawalker:%s:%s` from `%s`.\n\n[Build log](%s/build.log)\n' \
            "$repo" "$RELEASE_TAG" "$SOURCE_SHA" "$url" >> "$GITHUB_STEP_SUMMARY"
