name: Build Rust CLI

on:
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/build-rust-cli.yml'
      - 'LICENSE'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release_version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.package }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [android-repo-setup, android-repo-docs]
        platform: [windows, linux, macos]
        include:
          - platform: windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos
            runner: macos-15
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      PACKAGE: ${{ matrix.package }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v7
        if: inputs.release_version != ''
        with:
          python-version: '3.12'
      - name: Align the build version with the release tag
        if: inputs.release_version != ''
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"(?:0|[1-9][0-9]*)(?:\.(?:0|[1-9][0-9]*)){2}", version):
              raise SystemExit("Expected a stable X.Y.Z release version.")
          for filename in ("Cargo.toml", "docs/Cargo.toml", "Cargo.lock"):
              path = Path("cli") / filename
              content, count = re.subn(
                  r'(?m)^(name = "android-repo-(?:setup|docs)"\nversion = ")[^"\n]+(")$',
                  lambda match: match[1] + version + match[2],
                  path.read_text(encoding="utf-8"),
              )
              if count != (2 if filename == "Cargo.lock" else 1):
                  raise SystemExit(f"Could not locate the CLI package version in {filename}.")
              path.write_text(content, encoding="utf-8")
          PY
      - name: Build and smoke-test the release executable
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "$TARGET"
          cargo build --manifest-path cli/Cargo.toml --locked --release --target "$TARGET" --package "$PACKAGE"
          executable="$PACKAGE"
          if [[ "$RUNNER_OS" == Windows ]]; then executable+=.exe; fi
          binary="cli/target/$TARGET/release/$executable"
          version="$("$binary" --version)"
          printf '%s\n' "$version"
          "$binary" --help
          if [[ -n "$RELEASE_VERSION" && "$version" != "$PACKAGE $RELEASE_VERSION" ]]; then
            echo "The executable version must match the release version." >&2
            exit 1
          fi
          mkdir -p package dist
          cp "$binary" package/
          cp LICENSE package/
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath "dist/$env:PACKAGE-$env:TARGET.zip"
      - name: Package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "dist/$PACKAGE-$TARGET.tar.gz" -C package "$PACKAGE" LICENSE
      - name: Generate archive checksum
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          archive="$PACKAGE-$TARGET.tar.gz"
          if [[ "$RUNNER_OS" == Windows ]]; then archive="$PACKAGE-$TARGET.zip"; fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
